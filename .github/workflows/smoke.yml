name: Habit Quest smoke checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'cloud-config.js'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app syntax and contracts
        run: node --test tests/smoke.test.mjs
